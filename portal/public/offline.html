<html lang="en">
<head>

<title>You're offline · DE Educare</title>
<style>
  :root { color-scheme: light dark; }

  @media (prefers-color-scheme: dark) { body { background: #0F1220; color: #F2F3F8; } p { color: #A3A7BC !important; } }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 22px; margin: 18px 0 6px; }
  p { margin: 0 0 20px; color: #5A5F78; max-width: 320px; }
  button { font: 700 15px system-ui, sans-serif; padding: 12px 22px; border: 0; border-radius: 12px; background: #1F3A8A; color: #fff; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Check your internet connection. Answers you gave in a test are saved and will sync when you're back online.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
