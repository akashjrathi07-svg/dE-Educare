# Keeps the portal (Vercel) and the website (WordPress) warm so visitors don't hit a slow cold start.
# Free on public repositories. GitHub may delay scheduled runs by a few minutes at busy times.
name: Keep warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping portal and website
        run: |
          for url in \
            https://portal.deeducare.com/api/health \
            https://portal.deeducare.com/login \
            https://deeducare.com/ ; do
            curl -s -o /dev/null --max-time 30 -w "%{http_code} %{time_total}s $url\n" "$url" || true
          done
