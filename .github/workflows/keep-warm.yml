# Keeps the portal (Vercel) and the website (WordPress) warm so visitors don't hit a slow cold start.
# Free on public repositories. GitHub may delay scheduled runs by a few minutes at busy times.
name: Keep warm

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    # Scheduled runs only while the repo is public (free). On a private repo every-5-minute runs would cost
    # ~8,600 Actions minutes a month, so they are skipped; use a free pinger (cron-job.org / UptimeRobot) on the
    # same URLs instead. Manual "Run workflow" still works either way.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping portal and website
        run: |
          for url in \
            https://portal.deeducare.com/api/health \
            https://portal.deeducare.com/login \
            https://deeducare.com/ ; do
            curl -s -o /dev/null --max-time 30 -w "%{http_code} %{time_total}s $url\n" "$url" || true
          done
